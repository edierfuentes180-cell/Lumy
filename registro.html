<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta – Lumy</title>
<link href="./css/iniciosecion.css" rel="stylesheet">

</head>
<body>



<main class="auth">
  <div class="auth-card">

    <aside class="auth-lateral">
      <p>Tu belleza, nuestra pasión</p>
      <span>Crea tu cuenta y agenda tu primera cita.</span>
    </aside>

    <section class="auth-form">
      <h1>Crea tu cuenta</h1>
      <p class="subtitulo">Solo toma un minuto.</p>

      <form action="#" method="post">
        <div class="fila">
          <div class="campo">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
          </div>
         

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="300 000 0000" autocomplete="tel" required>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" minlength="8" autocomplete="new-password" required>
          </div>
         

       

        <button type="submit" class="btn-auth">Crear cuenta</button>
      </form>

      <p class="auth-cambio">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </section>

  </div>
</main>
<script src="./js/login.js"></script>
</body>
</html>
